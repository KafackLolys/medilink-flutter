name: medilink_flutter
description: Application Flutter autonome MedLink pour patients et médecins.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  file_picker: ^10.3.7
  http_parser: ^4.1.2
  google_sign_in: ^6.2.2
  line_awesome_flutter: ^3.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.json
