name: medilink_flutter
description: Application Flutter autonome MediLink pour patients et médecins.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  file_picker: ^10.3.7
  http_parser: ^4.1.2
  image: ^4.5.4
  google_sign_in: ^6.2.2
  line_awesome_flutter: ^3.0.1
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  flutter_secure_storage: ^9.2.4
  firebase_core: ^5.2.0
  firebase_auth: ^6.1.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.4
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/favicon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/favicon.png"
  min_sdk_android: 23
